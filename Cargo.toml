[package]
name = "wirrel"
description = "wirrel away nuts for the winter"
repository = "https://github.com/oclyke/wirrel"
readme = "README.md"
keywords = ["static", "site", "generator"]
categories = ["web-programming"]
version = "0.1.0"
edition = "2021"
license = "MIT"
exclude = [
  "CLAUDE.md",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
nucleo-matcher = "0.3"
pulldown-cmark = "0.12"
regex = "1"
skim = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
rstest = "0.23"
tempfile = "3"
